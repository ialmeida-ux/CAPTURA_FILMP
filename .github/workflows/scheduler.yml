name: Coleta yfinance Automatizada

on:
  schedule:
    # 09:15 AM BRT -> 12:15 UTC (Segunda a Sexta)
    - cron: '15 12 * * 1-5'
    # 19:00 PM BRT -> 22:00 UTC (Segunda a Sexta)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Permite executar manualmente pelo painel do GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de coleta
        run: python main.py