name: Coleta yfinance Automatizada REPO

on:
  schedule:
    - cron: '15 12 * * 1-5' # 09:15 BRT
    - cron: '0 22 * * 1-5'  # 19:00 BRT
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # Permissão explícita de escrita no repositório para este job
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de coleta
        run: python main.py

      - name: Commit e Push do CSV atualizado para o repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verifica se houve alteração no ficheiro CSV
          git add market_data_latest.csv
          
          # Se não houver alterações, o commit é ignorado sem dar erro
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: atualiza dados de mercado automatico [skip ci]" && git push)
